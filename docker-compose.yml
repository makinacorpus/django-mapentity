services:
  convertit:
    image: makinacorpus/convertit:latest

  screamshotter:
    image: makinacorpus/screamshotter:v2

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    working_dir: /code/src
    volumes:
      - ./:/code/src
    user: ${UID:-1000}:${GID:-1000}
    environment:
      - CYPRESS_INSTALL_BINARY=0
    command: sh -c "[ -d node_modules/vite ] || npm ci; npm run dev"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base

    ports:
      - "8000:8000"
    volumes:
      - ./:/code/src
    depends_on:
      - screamshotter
      - convertit

    user: ${UID:-1000}:${GID:-1000}
    command: /code/venv/bin/python ./manage.py runserver 0.0.0.0:8000
    networks:
      default:
        aliases:
          - mapentity.local
