name: CI

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - created
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install ruff
        run: |
          python -m pip install ruff -U

      - name: Check linting
        run: |
          ruff check mapentity test_project

      - name: Check format
        run: |
          ruff format --check mapentity test_project

  test:
    runs-on: ubuntu-latest
    container:
      image: python:${{ matrix.python-version }}-bookworm
      env:
        LANG: C.UTF-8

    strategy:
      matrix:
        python-version: [ '3.10', '3.13' ]
        django-version: [ '4.2.*', '5.2.*' ]

    env:
      PYTHON: ${{ matrix.python-version }}
      DJANGO: ${{ matrix.django-version }}

    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        apt-get -qq update
        apt-get -y install gettext libproj-dev binutils gdal-bin libgdal-dev libsqlite3-mod-spatialite libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-xlib-2.0-0 libffi-dev shared-mime-info libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libsasl2-dev python3-dev libldap2-dev libssl-dev

    - name: Install python dependencies
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip3 install .[dev]
        pip3 install Django==${{ matrix.django-version }} -U

    - name: Compile messages
      run: |
        ./manage.py compilemessages

    - name: Check pending migrations
      run: |
        ./manage.py makemigrations --check

    - name: Test with coverage
      run: |
        coverage run --parallel-mode --concurrency=multiprocessing ./manage.py test --exclude-tag=e2e --parallel -v 3
        coverage combine
        coverage xml -o coverage.xml

    - uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        env_vars: PYTHON,DJANGO
        token: ${{ secrets.CODECOV_TOKEN }} # not usually required for public repos
        fail_ci_if_error: true # optional (default = false)

  e2e-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install system dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install gettext libproj-dev binutils gdal-bin libgdal-dev libsqlite3-mod-spatialite libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-xlib-2.0-0 libffi-dev shared-mime-info libpangoft2-1.0-0 libjpeg-dev libopenjp2-7-dev libsasl2-dev python3-dev libldap2-dev libssl-dev

      - name: Install python dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          pip3 install .[dev]
          pip3 install Django==5.2.* -U

      - name: Install Playwright browsers
        run: |
          playwright install --with-deps chromium

      - name: Compile messages
        run: |
          ./manage.py compilemessages

      - name: Run Playwright E2E tests
        run: |
          ./manage.py test --tag=e2e -v 2

      - name: Upload Playwright videos on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-videos
          path: test-results/videos
          if-no-files-found: ignore

  publish:
    needs: [quality, test, e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/mapentity/

    if: ${{ github.event_name == 'release' && github.event.action == 'created' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Compile messages
        run: |
          pip install django
          sudo apt-get -qq update
          sudo apt-get -y install gettext
          django-admin compilemessages

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
